plugins {
    id 'com.android.application'
}

// APK file name: <Game_Name>-<version>-debug.apk / -release.apk
base {
    archivesName = '@@APK_NAME@@'
}

android {
    namespace = '@@PACKAGE@@'
    compileSdk = 37

    defaultConfig {
        applicationId = '@@PACKAGE@@'
        minSdk = 21
        // API 37 (Android 17): orientation locks are ignored on tablets/foldables; the port
        // already rescales to any window, so the game just gets letterboxed or bigger.
        targetSdk = 37
        versionCode = @@VERSION_CODE@@
        versionName = '@@VERSION_NAME@@'
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Signed with the debug key so "Build APK" gives an installable file.
            // Create your own key (Build > Generate Signed Bundle / APK) to publish.
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation project(':engine')
    @@GAME_DEPENDENCY@@
}
