plugins { id 'com.android.application' }
android {
    namespace 'j2a.offline.template'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.j2a.offline.template'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName 'J2A_GAME_VERSION'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { ndkBuild { arguments 'NDK_APPLICATION_MK=' + file('src/main/cpp/Application.mk').absolutePath } }
    }
    sourceSets.main {
        java.srcDirs += ['../../runtime/src/main/java', '../../runtime-extra/java', '../../runtime-m3g/java']
        assets.srcDirs += ['../../runtime/src/main/assets', '../../runtime-extra/assets']
    }
    externalNativeBuild { ndkBuild { path file('src/main/cpp/Android.mk') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable false } }
}
